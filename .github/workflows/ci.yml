name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Build & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Verify Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Build and verify backend with Testcontainers
        run: mvn --batch-mode clean verify -f backend/pom.xml

      - name: Upload JaCoCo Code Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Upload Surefire Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: backend/target/surefire-reports/
          retention-days: 14

      - name: Stash verified backend JAR for Docker build
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/sentinel-backend-*.jar
          retention-days: 1

  frontend:
    name: Frontend (Quality & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run Vitest unit and component tests
        run: npm test

      - name: Run Bun unit tests
        run: npm run test:bun

      - name: Run production frontend build
        run: npm run build

  security:
    name: Security Audits
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Restore OWASP Dependency-Check database cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-dependency-check-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-owasp-dependency-check-
            ${{ runner.os }}-owasp-dependency-check

      - name: Frontend dependency security audit (npm audit)
        run: npm audit --audit-level=high

      - name: Backend dependency security audit (OWASP Dependency-Check)
        id: owasp-scan
        timeout-minutes: 35
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          NVD_ARGS=""
          if [ -n "$NVD_API_KEY" ]; then
            echo "NVD API key detected; synchronizing with authenticated rate limits (nvdApiDelay: 3500ms)."
            NVD_ARGS="-DnvdApiKey=$NVD_API_KEY"
          else
            echo "::warning::No NVD API key provided (NVD_API_KEY secret is empty). Dependency-Check will use unauthenticated rate limits (8000ms delay) and may be slow or time out on cold cache."
          fi

          echo "Starting OWASP Dependency-Check scan..."
          START_TIME=$(date +%s)

          set +e
          mvn --batch-mode dependency-check:check -Psecurity-audit -f backend/pom.xml $NVD_ARGS
          SCAN_EXIT_CODE=$?
          set -e

          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          echo "scan_exit_code=$SCAN_EXIT_CODE" >> "$GITHUB_OUTPUT"
          echo "scan_duration=$DURATION" >> "$GITHUB_OUTPUT"

          if [ $SCAN_EXIT_CODE -ne 0 ]; then
            echo "::warning::OWASP Dependency-Check exited with code $SCAN_EXIT_CODE after ${DURATION}s."
            exit $SCAN_EXIT_CODE
          fi

      - name: Save OWASP Dependency-Check database cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-dependency-check-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Record OWASP Dependency-Check Step Summary
        if: always()
        run: |
          REPORT_FILE="backend/target/dependency-check-reports/dependency-check-report.html"
          OUTCOME="${{ steps.owasp-scan.outcome }}"
          DURATION="${{ steps.owasp-scan.outputs.scan_duration }}"

          echo "## Security Audit: OWASP Dependency-Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$REPORT_FILE" ] && [ "$OUTCOME" = "success" ]; then
            echo ":white_check_mark: **Status: Clean Scan Completed**" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Analysis:** Completed successfully in ${DURATION}s; vulnerability report generated." >> "$GITHUB_STEP_SUMMARY"
            echo "- **NVD Mode:** $([ -n "${{ secrets.NVD_API_KEY }}" ] && echo 'Authenticated (NVD API Key active)' || echo 'Unauthenticated fallback (Rate limited)')" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Report Artifact:** Saved in \`dependency-check-reports\` (HTML & JSON)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo ":warning: **Status: Incomplete / Timed-Out NVD Synchronization**" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Analysis:** The NVD vulnerability database download did not complete within the step allocation (Step outcome: \`$OUTCOME\`, duration: ${DURATION}s)." >> "$GITHUB_STEP_SUMMARY"
            echo "- **NVD Mode:** $([ -n "${{ secrets.NVD_API_KEY }}" ] && echo 'Authenticated (NVD API Key active)' || echo 'Unauthenticated fallback (Rate limited)')" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Cache Status:** Incremental NVD database state was safely preserved in the GitHub Actions cache via \`actions/cache/save\`." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Remediation:** Trigger the \`NVD Database Cache Warm\` workflow on \`main\` or retry the run to resume downloading from the saved cache checkpoint." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Notice:** The OWASP step runs in reporting-only mode (\`failOnError=false\`) during initial cache population so PR workflows remain non-blocking." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload OWASP Dependency-Check Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-reports
          path: backend/target/dependency-check-reports/
          retention-days: 14
          if-no-files-found: ignore

  docker:
    name: Docker Build & Container Verification
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve verified backend JAR from backend job
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production runtime container image
        run: |
          docker build -f backend/Dockerfile.ci -t velorix-sentinel-backend:ci backend

      - name: Verify container security configuration
        run: |
          echo "Verifying image user configuration (non-root UID 10001)..."
          USER_CONFIG=$(docker inspect --format='{{.Config.User}}' velorix-sentinel-backend:ci)
          if [ "$USER_CONFIG" != "10001:10001" ]; then
            echo "Error: Expected user 10001:10001, got $USER_CONFIG"
            exit 1
          fi
          echo "User configuration verified: $USER_CONFIG"

          echo "Verifying healthcheck instruction..."
          HEALTHCHECK_CONFIG=$(docker inspect --format='{{json .Config.Healthcheck}}' velorix-sentinel-backend:ci)
          if echo "$HEALTHCHECK_CONFIG" | grep -q "actuator/health"; then
            echo "Healthcheck probe verified."
          else
            echo "Error: Healthcheck probe missing actuator/health"
            exit 1
          fi

          echo "Verifying exposed port..."
          docker inspect --format='{{json .Config.ExposedPorts}}' velorix-sentinel-backend:ci | grep -q "10000"
          echo "Exposed port 10000 verified."

      - name: Smoke test container execution
        run: |
          echo "Starting container in background for runtime sanity check..."
          docker run -d --name sentinel-ci-smoke -p 10000:10000 -e SPRING_PROFILES_ACTIVE=test velorix-sentinel-backend:ci
          sleep 5
          RUNNING_USER=$(docker top sentinel-ci-smoke -o pid,user | tail -n +2 | awk '{print $2}')
          echo "Container active process owner: $RUNNING_USER"
          docker logs sentinel-ci-smoke | head -n 30
          docker stop sentinel-ci-smoke
          docker rm sentinel-ci-smoke
          echo "Container runtime smoke test passed."
