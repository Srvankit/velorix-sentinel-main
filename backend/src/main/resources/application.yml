spring:
  application:
    name: velorix-sentinel-backend

  datasource:
    # Supabase is standard PostgreSQL. Prefer SUPABASE_* in hosted deployments;
    # DB_* remains supported for local development and other PostgreSQL hosts.
    url: ${SUPABASE_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/velorix_sentinel}}
    username: ${SUPABASE_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${SUPABASE_DB_PASSWORD:${DB_PASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: velorix-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      initialization-fail-timeout: ${DB_INITIALIZATION_FAIL_TIMEOUT:10000}

  jpa:
    open-in-view: false
    hibernate:
      # Migration friendly: schema is owned by migrations, never by Hibernate.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: ${JPA_SQL_COMMENTS:false}
        jdbc:
          time_zone: UTC
    show-sql: ${JPA_SHOW_SQL:false}

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    # A broken database configuration should fail quickly and visibly.
    connect-retries: ${FLYWAY_CONNECT_RETRIES:1}
    connect-retries-interval: ${FLYWAY_CONNECT_RETRIES_INTERVAL:1}
    validate-on-migrate: true
    clean-disabled: true

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:100MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:105MB}
      file-size-threshold: 1MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
            required: ${SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${SMTP_READ_TIMEOUT:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT:5000}

server:
  forward-headers-strategy: framework
  # Render injects PORT when available; Docker defaults to the exposed web port.
  # Local development remains on 8081 unless PORT or SERVER_PORT is overridden.
  port: ${PORT:${SERVER_PORT:8081}}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    context-path: /

velorix:
  mail:
    from: ${MAIL_FROM:noreply@velorix.com}
    from-name: ${MAIL_FROM_NAME:Velorix Sentinel}
  app:
    # Public URL of the Velorix Sentinel web console; used to build email links.
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:8080}
    email-verification-expiration: ${EMAIL_VERIFICATION_EXPIRATION:PT24H}
    password-reset-expiration: ${PASSWORD_RESET_EXPIRATION:PT30M}
    # Refresh token lifetime when the user did not tick "keep me signed in".
    short-lived-refresh-expiration: ${SHORT_LIVED_REFRESH_EXPIRATION:PT12H}
  storage:
    provider: ${VELORIX_STORAGE_PROVIDER:filesystem}
    # Root directory of the local capture store when provider=filesystem.
    location: ${CAPTURE_STORAGE_LOCATION:./data/captures}
    max-file-size: ${CAPTURE_MAX_FILE_SIZE:100MB}
    max-files-per-user: ${CAPTURE_MAX_FILES_PER_USER:10}
    max-storage-per-user: ${CAPTURE_MAX_STORAGE_PER_USER:500MB}
    allowed-extensions: pcap,pcapng
    s3:
      bucket: ${S3_BUCKET_NAME:${SUPABASE_STORAGE_BUCKET:velorix-captures}}
      region: ${AWS_REGION:${S3_REGION:us-east-1}}
      endpoint: ${S3_ENDPOINT:${SUPABASE_STORAGE_S3_ENDPOINT:}}
      access-key: ${AWS_ACCESS_KEY_ID:${S3_ACCESS_KEY:}}
      secret-key: ${AWS_SECRET_ACCESS_KEY:${S3_SECRET_KEY:}}
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
      prefix: ${S3_PREFIX:captures/}
  inspection:
    reaper-interval: ${INSPECTION_REAPER_INTERVAL:60000}
    reaper-initial-delay: ${INSPECTION_REAPER_INITIAL_DELAY:30000}
    max-duration: ${INSPECTION_MAX_DURATION:PT15M}
  detection:
    # Stamped onto every finding so results stay traceable to the logic that produced them.
    engine-version: ${DETECTION_ENGINE_VERSION:detect-1.0.0}
    batch-size: ${DETECTION_BATCH_SIZE:500}
    stream-chunk-size: ${DETECTION_STREAM_CHUNK_SIZE:10000}
    # Safety valves: attacker supplied captures must never exhaust a worker.
    max-findings-per-rule: ${DETECTION_MAX_FINDINGS_PER_RULE:200}
    max-sample-frames: ${DETECTION_MAX_SAMPLE_FRAMES:20}
    max-tracked-keys: ${DETECTION_MAX_TRACKED_KEYS:200000}
    # Comma separated rule ids to silence without a redeploy, e.g. unknown-protocol.
    disabled-rules: ${DETECTION_DISABLED_RULES:}
  security:
    jwt:
      # Base64 encoded HMAC-SHA secret. MUST be provided via environment in every real environment.
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:velorix-sentinel}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
      refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P7D}
      token-prefix: "Bearer "
      header-name: Authorization
    # Comma-separated list of trusted reverse proxy IP addresses or CIDR blocks (e.g. "127.0.0.1,::1,10.0.0.0/8").
    # Default is empty (fail-closed: direct client requests cannot spoof their IP using forwarded headers).
    trusted-proxies: ${TRUSTED_PROXIES:}
  # Configure OAuth clients through SPRING_SECURITY_OAUTH2_CLIENT_* environment variables.
  # Redirect URI for both providers: https://velorix-sentinel-backend.onrender.com/login/oauth2/code/{registrationId}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173,http://localhost:3000,https://velorixsentinel.netlify.app,https://*.netlify.app,https://*.lovable.app,https://*.lovableproject.com}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    exposed-headers: Authorization
    allow-credentials: true
    max-age: 3600
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  retention:
    enabled: ${RETENTION_ENABLED:true}
    cron: ${RETENTION_CRON:0 0 3 * * *}
    zone: ${RETENTION_ZONE:UTC}
    batch-size: ${RETENTION_BATCH_SIZE:1000}
    refresh-token-retention: ${RETENTION_REFRESH_TOKENS:P30D}
    verification-token-retention: ${RETENTION_VERIFICATION_TOKENS:P7D}
    activity-log-retention: ${RETENTION_ACTIVITY_LOGS:P90D}
    soft-deleted-file-retention: ${RETENTION_SOFT_DELETED_FILES:P30D}
  ratelimit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    login-ip-capacity: ${RATE_LIMIT_LOGIN_IP_CAPACITY:5}
    login-ip-duration: ${RATE_LIMIT_LOGIN_IP_DURATION:PT1M}
    login-email-capacity: ${RATE_LIMIT_LOGIN_EMAIL_CAPACITY:10}
    login-email-duration: ${RATE_LIMIT_LOGIN_EMAIL_DURATION:PT1M}
    register-ip-capacity: ${RATE_LIMIT_REGISTER_IP_CAPACITY:3}
    register-ip-duration: ${RATE_LIMIT_REGISTER_IP_DURATION:PT1H}
    forgot-password-capacity: ${RATE_LIMIT_FORGOT_PASSWORD_CAPACITY:3}
    forgot-password-duration: ${RATE_LIMIT_FORGOT_PASSWORD_DURATION:PT15M}
    file-upload-capacity: ${RATE_LIMIT_FILE_UPLOAD_CAPACITY:10}
    file-upload-duration: ${RATE_LIMIT_FILE_UPLOAD_DURATION:PT1H}
    general-api-capacity: ${RATE_LIMIT_GENERAL_API_CAPACITY:120}
    general-api-duration: ${RATE_LIMIT_GENERAL_API_DURATION:PT1M}
    max-buckets: ${RATE_LIMIT_MAX_BUCKETS:50000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  health:
    # Render's liveness probe must only verify that the web process is alive.
    # Database readiness is exercised by the authenticated application paths
    # and must not prevent the container from opening its port.
    db:
      enabled: false

logging:
  level:
    root: INFO
    com.velorix.sentinel: ${LOG_LEVEL_APP:INFO}
    org.springframework.security: INFO
    org.springframework.mail: INFO
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:INFO}
    org.hibernate.orm.jdbc.bind: ${LOG_LEVEL_HIBERNATE_BIND:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
