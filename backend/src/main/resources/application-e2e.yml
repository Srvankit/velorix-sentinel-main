server:
  port: 8080
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://localhost:5499/sentinel_e2e
    username: sentinel
    password: sentinel
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: velorix-e2e-pool
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration

velorix:
  storage:
    provider: filesystem
    location: ./data/captures-e2e
  app:
    frontend-base-url: http://localhost:5173
    email-verification-expiration: PT24H
  scheduling:
    enabled: false
  retention:
    enabled: false
  ratelimit:
    enabled: false
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
  security:
    jwt:
      secret: dGVzdC1zZWNyZXQtZm9yLXZlbG9yaXgtc2VudGluZWwtaW50ZWdyYXRpb24tdGVzdHMtb25seS1uZXZlci11c2VkLWluLXByb2R1Y3Rpb24tMDEyMzQ1Njc4OQ==
      access-token-expiration: PT15M
      refresh-token-expiration: P7D

logging:
  level:
    com.velorix.sentinel: INFO
