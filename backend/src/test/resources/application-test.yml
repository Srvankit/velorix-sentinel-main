server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///sentinel_test?TC_DAEMON=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: sentinel
    password: sentinel
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    locations: classpath:db/migration

velorix:
  storage:
    provider: filesystem
    location: ${java.io.tmpdir}/velorix-sentinel-test-captures
  app:
    frontend-base-url: http://localhost:5173
  scheduling:
    enabled: false
  retention:
    enabled: false
  ratelimit:
    enabled: false
  cors:
    allowed-origins:
      - https://velorixsentinel.netlify.app
      - http://localhost:5173
      - http://localhost:3000
  security:
    jwt:
      # Test-only signing material; production reads JWT_SECRET from the environment.
      secret: dGVzdC1zZWNyZXQtZm9yLXZlbG9yaXgtc2VudGluZWwtaW50ZWdyYXRpb24tdGVzdHMtb25seS1uZXZlci11c2VkLWluLXByb2R1Y3Rpb24tMDEyMzQ1Njc4OQ==
      access-token-expiration: PT15M
      refresh-token-expiration: P7D

logging:
  level:
    com.velorix.sentinel: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
      validate-group-membership: false
      group:
        liveness:
          include: ping
        readiness:
          include: db,diskSpace,storage,inspectionQueue
  health:
    db:
      enabled: ${MANAGEMENT_HEALTH_DB_ENABLED:true}
    mail:
      enabled: false
